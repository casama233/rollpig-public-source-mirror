name: Apply mirror protocol headers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-protocol-headers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch mirror client identity
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/sync_primary.py')
          text = path.read_text(encoding='utf-8')
          old = 'USER_AGENT = "RollPig-Public-Mirror/1 (+https://github.com/casama233/rollpig-public-source-mirror)"'
          new = 'USER_AGENT = "AstrBot-RollPig/3.11.5 (+https://github.com/casama233/rollpig-public-source-mirror; mirror)"'
          if text.count(old) != 1:
              raise SystemExit('unexpected USER_AGENT declaration')
          text = text.replace(old, new, 1)
          old_headers = '''                "User-Agent": USER_AGENT,\n                "Accept": "application/json, application/octet-stream;q=0.9, */*;q=0.1",\n                "Cache-Control": "no-cache",'''
          new_headers = '''                "User-Agent": USER_AGENT,\n                "X-RollPig-Client": CLIENT_ID,\n                "X-RollPig-Protocol": str(SCHEMA_VERSION),\n                "Accept": "application/json, application/octet-stream;q=0.9, */*;q=0.1",\n                "Cache-Control": "no-cache",'''
          if text.count(old_headers) != 1:
              raise SystemExit('unexpected request header block')
          path.write_text(text.replace(old_headers, new_headers, 1), encoding='utf-8')
          PY
          rm -f sync-diagnostic.txt
          git rm .github/workflows/apply-protocol-headers.yml
          git diff --check
      - name: Commit protocol fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: authenticate mirror as Resource Protocol v1 client"
          git push
