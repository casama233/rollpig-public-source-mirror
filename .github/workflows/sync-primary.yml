# Publication remains frozen until a separate rights-and-client restoration review.
name: Public mirror provenance guard

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "publication-approvals.json"
      - "vercel.json"
      - ".github/workflows/sync-primary.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "publication-approvals.json"
      - "vercel.json"
      - ".github/workflows/sync-primary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test publication authorization and protocol integrity
        run: python -m unittest discover -s tests -v

      - name: Assert the entire publication is notice-only
        shell: bash
        run: |
          test -f public/NOTICE.txt
          test ! -L public/NOTICE.txt
          test "$(find public -mindepth 1 -print)" = "public/NOTICE.txt"
          echo "Mirror remains fail-closed; no artwork or resource snapshot is published."
