# Every published file is bound to the existing source-service rights review.
name: Public mirror provenance guard

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "publication-approvals.json"
      - "vercel.json"
      - ".github/workflows/sync-primary.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "publication-approvals.json"
      - "vercel.json"
      - ".github/workflows/sync-primary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test publication authorization and protocol integrity
        run: python -m unittest discover -s tests -v

      - name: Validate the complete reviewed publication
        run: python scripts/build_publication.py

      - name: Require withdrawn snapshots to be removed from GitHub publication
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          policy = json.loads(Path('publication-approvals.json').read_text())
          if not any(v.get('status') == 'approved' for v in policy['approved_snapshots'].values()):
              assert not Path('public/v1').exists(), 'Remove withdrawn public/v1 files in the same commit'
          PYTHON
