# Fail closed while the provenance / redistribution-rights audit is open.
name: Public mirror provenance guard

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/sync-primary.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/sync-primary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert stale public snapshot is not publishable
        shell: bash
        run: |
          test -f public/NOTICE.txt
          if [ -e public/v1 ]; then
            echo "::error::public/v1 is disabled during the provenance audit. Restore it only through a separately reviewed provenance-safe base-only publication change."
            exit 1
          fi
          echo "Mirror is fail-closed: no public/v1 snapshot is present."
