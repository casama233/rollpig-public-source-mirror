repos:
  - repo: local
    hooks:
      - id: mirror-python-compile
        name: Compile mirror tooling
        entry: python -m py_compile scripts/sync_primary.py scripts/validate_snapshot.py
        language: system
        pass_filenames: false
      - id: mirror-snapshot-integrity
        name: Validate mirrored Resource Protocol v1 snapshot
        entry: python scripts/validate_snapshot.py public/v1
        language: system
        pass_filenames: false
